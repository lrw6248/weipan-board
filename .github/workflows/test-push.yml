name: 测试推送（手动，只发一条消息）

# 用途：配好飞书 / Server酱 之后，点一下这里就能验证是否打通，
# 不用等到状态变化那天。不更新数据、不改 .last_state.json。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install --quiet requests

      - name: 写入推送密钥（来自仓库 Secrets）
        run: |
          printf '{"serverchan_sendkey":"%s","email":{},"feishu_webhook":"%s","feishu_secret":"%s"}\n' \
            "${{ secrets.SERVERCHAN_SENDKEY }}" \
            "${{ secrets.FEISHU_WEBHOOK }}" \
            "${{ secrets.FEISHU_SECRET }}" > config.json

      - name: 发送测试消息
        run: python scripts/test_push.py
